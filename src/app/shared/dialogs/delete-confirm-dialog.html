<h2 mat-dialog-title>

    🗑 Delete Document

</h2>

<mat-dialog-content>

    <p>

        Are you sure you want to delete

    </p>

    <h3>

        {{data.fileName}}

    </h3>

    <p>

        This action cannot be undone.

    </p>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
            mat-button
            (click)="cancel()">

        Cancel

    </button>

    <button
            mat-raised-button
            color="warn"
            (click)="delete()">

        Delete

    </button>

</mat-dialog-actions>
